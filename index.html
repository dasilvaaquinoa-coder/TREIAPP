 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Semanal - Aquinoã</title>
    <!-- Tailwind CSS local via CDN compatível -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilação in-browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialWorkouts = {
            "Segunda-feira (Treino A)": [
                { id: 1, name: "Extensora", sets: "4", reps: "12/10/6-8/RM", load: "20 / 25 / 27 / 30 kg" },
                { id: 2, name: "Leg Press 45°", sets: "4", reps: "12/8-10/6-8/6-8", load: "170 / 180 / 186 / 188 kg" },
                { id: 3, name: "Agachamento Livre", sets: "3", reps: "12 / 10 / 6-8", load: "22 / 50 / 58 kg" },
                { id: 4, name: "Afundo no Smith", sets: "3", reps: "10 / 10 / 10", load: "10 kg" }
            ],
            "Terça-feira (Treino B)": [
                { id: 1, name: "Puxada Aberta - Pronada", sets: "4", reps: "12/10/6-8/RM", load: "40 / 43 / 43 / 45 kg" },
                { id: 2, name: "Remada Baixa - Triângulo", sets: "3", reps: "10-12", load: "40 / 42 / 42 kg" },
                { id: 3, name: "Pulldown - Corda", sets: "3", reps: "8-10", load: "26 / 27 / 27 kg" },
                { id: 4, name: "Remada Curvada - Supinada", sets: "3", reps: "10-12", load: "10 / 20 / 20 kg" },
                { id: 5, name: "Desenvolvimento - Halter", sets: "4", reps: "8-10", load: "20 kg" },
                { id: 6, name: "Elevação Lateral - Polia", sets: "3", reps: "10-12", load: "5 / 7 kg" }
            ],
            "Quarta-feira (Treino C)": [
                { id: 1, name: "Stiff - Barra", sets: "4", reps: "15/12/10/6-8", load: "40 / 50 / 54 / 56 kg" },
                { id: 2, name: "Cadeira Flexora", sets: "4", reps: "12/10/6-8/RM", load: "55 / 60 / 65 / 65 kg" },
                { id: 3, name: "Flexora Unilateral", sets: "3", reps: "8-10", load: "10 / 12 / 13 kg" },
                { id: 4, name: "Levantamento Terra Sumô", sets: "3", reps: "10-12", load: "40 / 43 / 45 kg" },
                { id: 5, name: "Abdominal com Rolinho", sets: "4", reps: "10-12", load: "Peso corporal" },
                { id: 6, name: "Flexão Plantar (Leg Press)", sets: "3", reps: "RM", load: "40 / 50 / 55 kg" }
            ],
            "Quinta-feira (Treino D)": [
                { id: 1, name: "Crucifixo - Crossover", sets: "4", reps: "10-12", load: "20 / 24 / 26 kg" },
                { id: 2, name: "Supino Inclinado - Halter", sets: "3", reps: "10-12", load: "24 / 28 kg" },
                { id: 3, name: "Tríceps Pulley - Crossover", sets: "4", reps: "15/12/10/6", load: "15 / 17 / 18 / 20 kg" },
                { id: 4, name: "Tríceps Francês - Polia", sets: "3", reps: "12/10/8", load: "25 / 27 kg" },
                { id: 5, name: "Rosca Alternada - Inclinado", sets: "3", reps: "10-12", load: "10 / 14 kg" },
                { id: 6, name: "Rosca Martelo - Crossover", sets: "3", reps: "12/10/8/6", load: "25 / 26 / 27 kg" }
            ],
            "Sexta-feira (Treino E)": [
                { id: 1, name: "Cadeira Abdutora", sets: "4", reps: "RM", load: "90 / 94 kg" },
                { id: 2, name: "Elevação Pélvica Articulada", sets: "3", reps: "12/10/8", load: "65 / 70 / 75 kg" },
                { id: 3, name: "Agachamento Sumô - Halter", sets: "3", reps: "10-12", load: "50 / 60 / 64 kg" },
                { id: 4, name: "Búlgaro no Smith", sets: "3", reps: "10/10/10", load: "26 kg" },
                { id: 5, name: "Leg Press 45° Articulado", sets: "4", reps: "12/8/6/6", load: "170 / 180 / 188 kg" }
            ]
        };

        function App() {
            const [workouts, setWorkouts] = useState(() => {
                const saved = localStorage.getItem('aquinoa_workouts');
                return saved ? JSON.parse(saved) : initialWorkouts;
            });
            const [activeDay, setActiveDay] = useState("Segunda-feira (Treino A)");
            const [timer, setTimer] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                localStorage.setItem('aquinoa_workouts', JSON.stringify(workouts));
            }, [workouts]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning) {
                    interval = setInterval(() => setTimer(t => t + 1), 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleSaveLoad = (day, id, newLoad) => {
                const updated = { ...workouts };
                updated[day] = updated[day].map(ex => ex.id === id ? { ...ex, load: newLoad } : ex);
                setWorkouts(updated);
                setEditingId(null);
            };

            return (
                <div className="max-w-md mx-auto p-4 pb-20">
                    <header className="mb-6 text-center">
                        <span className="text-xs uppercase tracking-widest text-emerald-400 font-semibold">Painel de Performance</span>
                        <h1 className="text-2xl font-bold text-white mt-1">Treino Semanal - Aquinoã</h1>
                    </header>

                    <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-6 shadow-lg text-center">
                        <div className="text-zinc-400 text-xs mb-1 font-semibold">CRONÔMETRO DE DESCANSO</div>
                        <div className="text-4xl font-mono font-bold text-emerald-400 mb-3">{formatTime(timer)}</div>
                        <div className="flex justify-center gap-2">
                            <button onClick={() => { setTimer(0); setIsTimerRunning(true); }} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium">Iniciar</button>
                            <button onClick={() => setIsTimerRunning(false)} className="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium">Pausar</button>
                            <button onClick={() => { setIsTimerRunning(false); setTimer(0); }} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg text-xs">Zerar</button>
                        </div>
                    </div>

                    <div className="flex overflow-x-auto gap-2 mb-6 pb-2">
                        {Object.keys(workouts).map((day) => (
                            <button
                                key={day}
                                onClick={() => setActiveDay(day)}
                                className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${activeDay === day ? 'bg-emerald-500 text-zinc-950 font-bold shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-zinc-800'}`}
                            >
                                {day.split(" ")[0]}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-3">
                        <h2 className="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">{activeDay}</h2>
                        {workouts[activeDay].map((ex) => (
                            <div key={ex.id} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-2">
                                <div className="flex justify-between items-start">
                                    <span className="font-medium text-white text-sm">{ex.name}</span>
                                    <span className="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono">{ex.sets} séries • {ex.reps}</span>
                                </div>
                                <div className="flex justify-between items-center mt-1 pt-2 border-t border-zinc-800/50">
                                    <div className="text-xs text-emerald-400 font-mono font-semibold">Carga: {ex.load}</div>
                                    <button 
                                        onClick={() => setEditingId(editingId === ex.id ? null : ex.id)}
                                        className="text-xs text-zinc-400 hover:text-emerald-400 underline"
                                    >
                                        {editingId === ex.id ? 'Fechar' : 'Editar Carga'}
                                    </button>
                                </div>
                                {editingId === ex.id && (
                                    <div className="mt-2 flex gap-2">
                                        <input 
                                            type="text" 
                                            defaultValue={ex.load}
                                            id={`input-${ex.id}`}
                                            className="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs text-white flex-1 font-mono"
                                        />
                                        <button 
                                            onClick={() => {
                                                const val = document.getElementById(`input-${ex.id}`).value;
                                                handleSaveLoad(activeDay, ex.id, val);
                                            }}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-medium"
                                        >
                                            Salvar
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
