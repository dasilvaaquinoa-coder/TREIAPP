<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino Semanal - Aquinoã</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-zinc-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialWorkouts = {
            "Segunda-feira (Treino A)": [
                { id: 1, name: "Extensora", targetSets: 4, repsArray: ["12", "10", "6-8", "RM"], load: "20 / 25 / 27 / 30 kg", completedSets: [] },
                { id: 2, name: "Leg Press 45°", targetSets: 4, repsArray: ["12", "8-10", "6-8", "6-8"], load: "170 / 180 / 186 / 188 kg", completedSets: [] },
                { id: 3, name: "Agachamento Livre", targetSets: 3, repsArray: ["12", "10", "6-8"], load: "22 / 50 / 58 kg", completedSets: [] },
                { id: 4, name: "Afundo no Smith", targetSets: 3, repsArray: ["10", "10", "10"], load: "10 kg", completedSets: [] }
            ],
            "Terça-feira (Treino B)": [
                { id: 1, name: "Puxada Aberta - Pronada", targetSets: 4, repsArray: ["12", "10", "6-8", "RM"], load: "40 / 43 / 43 / 45 kg", completedSets: [] },
                { id: 2, name: "Remada Baixa - Triângulo", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "40 / 42 / 42 kg", completedSets: [] },
                { id: 3, name: "Pulldown - Corda", targetSets: 3, repsArray: ["8-10", "8-10", "8-10"], load: "26 / 27 / 27 kg", completedSets: [] },
                { id: 4, name: "Remada Curvada - Supinada", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "10 / 20 / 20 kg", completedSets: [] },
                { id: 5, name: "Desenvolvimento - Halter", targetSets: 4, repsArray: ["8-10", "8-10", "8-10", "8-10"], load: "20 kg", completedSets: [] },
                { id: 6, name: "Elevação Lateral - Polia", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "5 / 7 kg", completedSets: [] },
                { id: 7, name: "Elevação Frontal na Polia", targetSets: 3, repsArray: ["12", "10", "6-8"], load: "10 / 12 / 15 kg", completedSets: [] }
            ],
            "Quarta-feira (Treino C)": [
                { id: 1, name: "Stiff - Barra", targetSets: 4, repsArray: ["15", "12", "10", "6-8"], load: "40 / 50 / 54 / 56 kg", completedSets: [] },
                { id: 2, name: "Cadeira Flexora", targetSets: 4, repsArray: ["12", "10", "6-8", "RM"], load: "55 / 60 / 65 / 65 kg", completedSets: [] },
                { id: 3, name: "Flexora Unilateral", targetSets: 3, repsArray: ["8-10", "8-10", "8-10"], load: "10 / 12 / 13 kg", completedSets: [] },
                { id: 4, name: "Levantamento Terra Sumô", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "40 / 43 / 45 kg", completedSets: [] },
                { id: 5, name: "Abdominal com Rolinho", targetSets: 4, repsArray: ["10-12", "10-12", "10-12", "10-12"], load: "Peso corporal", completedSets: [] },
                { id: 6, name: "Flexão Plantar (Leg Press)", targetSets: 3, repsArray: ["RM", "RM", "RM"], load: "40 / 50 / 55 kg", completedSets: [] }
            ],
            "Quinta-feira (Treino D)": [
                { id: 1, name: "Supino Reto", targetSets: 3, repsArray: ["12", "10", "6-8"], load: "40 / 50 / 60 kg", completedSets: [] },
                { id: 2, name: "Crucifixo - Crossover", targetSets: 4, repsArray: ["10-12", "10-12", "10-12", "10-12"], load: "20 / 24 / 26 kg", completedSets: [] },
                { id: 3, name: "Supino Inclinado - Halter", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "24 / 28 kg", completedSets: [] },
                { id: 4, name: "Tríceps Pulley - Crossover", targetSets: 4, repsArray: ["15", "12", "10", "6"], load: "15 / 17 / 18 / 20 kg", completedSets: [] },
                { id: 5, name: "Tríceps Francês - Polia", targetSets: 3, repsArray: ["12", "10", "8"], load: "25 / 27 kg", completedSets: [] },
                { id: 6, name: "Rosca Alternada - Inclinado", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "10 / 14 kg", completedSets: [] },
                { id: 7, name: "Rosca Martelo - Crossover", targetSets: 3, repsArray: ["12", "10", "8", "6"], load: "25 / 26 / 27 kg", completedSets: [] }
            ],
            "Sexta-feira (Treino E)": [
                { id: 1, name: "Cadeira Abdutora", targetSets: 4, repsArray: ["RM", "RM", "RM", "RM"], load: "90 / 94 kg", completedSets: [] },
                { id: 2, name: "Elevação Pélvica Articulada", targetSets: 3, repsArray: ["12", "10", "8"], load: "65 / 70 / 75 kg", completedSets: [] },
                { id: 3, name: "Agachamento Sumô - Halter", targetSets: 3, repsArray: ["10-12", "10-12", "10-12"], load: "50 / 60 / 64 kg", completedSets: [] },
                { id: 4, name: "Búlgaro no Smith", targetSets: 3, repsArray: ["10", "10", "10"], load: "26 kg", completedSets: [] },
                { id: 5, name: "Leg Press 45° Articulado", targetSets: 4, repsArray: ["12", "8", "6", "6"], load: "170 / 180 / 188 kg", completedSets: [] }
            ]
        };

        function App() {
            const [workouts, setWorkouts] = useState(() => {
                const saved = localStorage.getItem('aquinoa_workouts_v9');
                return saved ? JSON.parse(saved) : initialWorkouts;
            });
            const [activeDay, setActiveDay] = useState("Segunda-feira (Treino A)");
            const [timer, setTimer] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                localStorage.setItem('aquinoa_workouts_v9', JSON.stringify(workouts));
            }, [workouts]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning) {
                    interval = setInterval(() => setTimer(t => t + 1), 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                const h = Math.floor(secs / 3600);
                if (h > 0) {
                    const remM = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
                    return `${h.toString().padStart(2, '0')}:${remM}:${s}`;
                }
                return `${m}:${s}`;
            };

            const handleSaveLoad = (day, id, newLoad) => {
                setWorkouts(prev => ({
                    ...prev,
                    [day]: prev[day].map(ex => ex.id === id ? { ...ex, load: newLoad } : ex)
                }));
                setEditingId(null);
            };

            const toggleSet = (day, exerciseId, setIndex) => {
                setWorkouts(prev => ({
                    ...prev,
                    [day]: prev[day].map(ex => {
                        if (ex.id !== exerciseId) return ex;
                        const currentCompleted = ex.completedSets || [];
                        const isDone = currentCompleted.includes(setIndex);
                        const updatedCompleted = isDone
                            ? currentCompleted.filter(i => i !== setIndex)
                            : [...currentCompleted, setIndex];
                        return { ...ex, completedSets: updatedCompleted };
                    })
                }));
            };

            const currentList = workouts[activeDay] || [];
            
            let totalSetsInDay = 0;
            let completedSetsInDay = 0;
            currentList.forEach(ex => {
                totalSetsInDay += ex.targetSets;
                completedSetsInDay += (ex.completedSets || []).length;
            });
            const progressPercent = totalSetsInDay > 0 ? Math.round((completedSetsInDay / totalSetsInDay) * 100) : 0;

            return (
                <div className="max-w-md mx-auto p-4 pb-24">
                    {/* Header */}
                    <header className="mb-5 flex items-center justify-between pt-1">
                        <div>
                            <div className="flex items-center gap-1.5 text-emerald-400 font-semibold text-xs tracking-wider uppercase">
                                <span>🏋️‍♂️ Performance Gym</span>
                            </div>
                            <h1 className="text-2xl font-black text-white mt-0.5 tracking-tight">Treino Semanal</h1>
                        </div>
                        <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-zinc-950 font-black text-sm flex items-center justify-center shadow-lg shadow-emerald-500/20">
                            AB
                        </div>
                    </header>

                    {/* Cronômetro Circular Moderno */}
                    <div className="bg-zinc-900/90 border border-zinc-800/80 rounded-3xl p-6 mb-5 shadow-2xl relative overflow-hidden backdrop-blur-md flex flex-col items-center">
                        <div className="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div className="w-full flex justify-between items-center mb-4">
                            <span className="text-zinc-400 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                                ⏱️ Descanso
                            </span>
                            <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full font-bold tracking-wide">
                                Série Ativa
                            </span>
                        </div>

                        {/* Anel Circular do Relógio */}
                        <div className="relative w-48 h-48 rounded-full border-4 border-zinc-800 flex flex-col items-center justify-center shadow-inner bg-zinc-950/50 mb-4">
                            <div className="absolute top-2 w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
                            <div className="text-3xl font-mono font-black text-white tracking-wider drop-shadow-md">
                                {formatTime(timer)}
                            </div>
                            <button 
                                onClick={() => setTimer(t => t + 60)}
                                className="mt-2 text-[11px] text-emerald-400 font-semibold bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 px-3 py-1 rounded-full transition-all cursor-pointer"
                            >
                                +1:00
                            </button>
                        </div>

                        {/* Botões do Cronômetro */}
                        <div className="w-full flex items-center gap-2">
                            <button 
                                onClick={() => { setTimer(0); setIsTimerRunning(true); }} 
                                className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold py-3 rounded-2xl text-xs transition-all active:scale-95 shadow-lg shadow-emerald-500/20 cursor-pointer flex items-center justify-center"
                            >
                                {isTimerRunning ? 'A Contar' : 'Iniciar'}
                            </button>
                            <button 
                                onClick={() => setIsTimerRunning(false)} 
                                className="flex-1 bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 font-bold py-3 rounded-2xl text-xs transition-all active:scale-95 border border-zinc-700/60 cursor-pointer flex items-center justify-center"
                            >
                                Pausar
                            </button>
                            <button 
                                onClick={() => { setIsTimerRunning(false); setTimer(0); }} 
                                className="bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 hover:text-white px-4 py-3 rounded-2xl text-xs transition-all active:scale-95 border border-zinc-700/60 cursor-pointer flex items-center justify-center font-bold"
                            >
                                Zera
                            </button>
                        </div>
                    </div>

                    {/* Seletor de Dias (Abas) */}
                    <div className="flex overflow-x-auto gap-2 mb-5 pb-2 no-scrollbar">
                        {Object.keys(workouts).map((day) => {
                            const isSelected = activeDay === day;
                            const label = day.split(" ")[0].replace("-feira", "");
                            const letter = day.match(/Treino ([A-E])/)?.[1] || "";
                            return (
                                <button
                                    key={day}
                                    onClick={() => setActiveDay(day)}
                                    className={`px-4 py-3 rounded-2xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-2 cursor-pointer ${
                                        isSelected 
                                            ? 'bg-emerald-500 text-zinc-950 shadow-lg shadow-emerald-500/20 scale-105' 
                                            : 'bg-zinc-900/90 text-zinc-400 border border-zinc-800/80 hover:border-zinc-700'
                                    }`}
                                >
                                    <span>{label}</span>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-black ${isSelected ? 'bg-zinc-950/20 text-zinc-950' : 'bg-zinc-800 text-zinc-400'}`}>
                                        {letter}
                                    </span>
                                </button>
                            );
                        })}
                    </div>

                    {/* Progresso de Séries */}
                    <div className="mb-5 bg-zinc-900/70 border border-zinc-800/80 rounded-2xl p-4">
                        <div className="flex justify-between items-center text-xs mb-2">
                            <span className="text-zinc-400 font-bold uppercase tracking-wider">Progresso de Séries</span>
                            <span className="text-emerald-400 font-black">{completedSetsInDay} de {totalSetsInDay} séries ({progressPercent}%)</span>
                        </div>
                        <div className="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                            <div 
                                className="bg-gradient-to-r from-emerald-500 to-emerald-400 h-full rounded-full transition-all duration-300 ease-out" 
                                style={{ width: `${progressPercent}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Lista de Exercícios */}
                    <div className="space-y-4">
                        <div className="flex justify-between items-center text-xs font-bold text-zinc-400 uppercase tracking-wider px-1">
                            <span>{activeDay}</span>
                        </div>

                        {currentList.map((ex) => {
                            const completedCount = (ex.completedSets || []).length;
                            const isAllDone = completedCount === ex.targetSets;

                            return (
                                <div 
                                    key={ex.id} 
                                    className={`bg-zinc-900 border rounded-3xl p-4 transition-all duration-200 ${
                                        isAllDone 
                                            ? 'border-emerald-500/40 bg-emerald-500/[0.03]' 
                                            : 'border-zinc-800/80'
                                    }`}
                                >
                                    {/* Cabeçalho do Exercício */}
                                    <div className="flex items-center justify-between mb-3 pb-3 border-b border-zinc-800/60">
                                        <div>
                                            <h3 className={`font-bold text-base ${isAllDone ? 'text-emerald-400' : 'text-white'}`}>
                                                {ex.name}
                                            </h3>
                                            <div className="text-xs text-zinc-400 font-medium mt-0.5">
                                                Carga: <span className="text-emerald-400 font-mono font-bold">{ex.load}</span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setEditingId(editingId === ex.id ? null : ex.id)}
                                            className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-1.5 rounded-xl transition-colors font-semibold cursor-pointer border border-zinc-700/50"
                                        >
                                            {editingId === ex.id ? 'Fechar' : '✏️ Carga'}
                                        </button>
                                    </div>

                                    {/* Form de Edição de Carga */}
                                    {editingId === ex.id && (
                                        <div className="mb-4 p-3 bg-zinc-950 border border-zinc-800 rounded-2xl flex gap-2">
                                            <input 
                                                type="text" 
                                                defaultValue={ex.load}
                                                id={`input-${ex.id}`}
                                                className="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 text-xs text-white flex-1 font-mono focus:outline-none focus:border-emerald-500"
                                                placeholder="Ex: 20 / 25 / 30 kg"
                                            />
                                            <button 
                                                onClick={() => {
                                                    const val = document.getElementById(`input-${ex.id}`).value;
                                                    handleSaveLoad(activeDay, ex.id, val);
                                                }}
                                                className="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-4 py-1.5 rounded-xl text-xs font-black transition-all cursor-pointer"
                                            >
                                                Salvar
                                            </button>
                                        </div>
                                    )}

                                    {/* Lista Individual de Séries */}
                                    <div className="space-y-2">
                                        {Array.from({ length: ex.targetSets }).map((_, index) => {
                                            const isSetDone = (ex.completedSets || []).includes(index);
                                            const repTarget = ex.repsArray[index] || ex.repsArray[0] || "RM";

                                            return (
                                                <div 
                                                    key={index}
                                                    onClick={() => toggleSet(activeDay, ex.id, index)}
                                                    className={`flex items-center justify-between p-2.5 rounded-2xl border transition-all cursor-pointer ${
                                                        isSetDone 
                                                            ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300' 
                                                            : 'bg-zinc-950/60 border-zinc-800/80 text-zinc-300 hover:border-zinc-700'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-2.5">
                                                        <div className={`w-6 h-6 rounded-lg text-xs font-black flex items-center justify-center ${
                                                            isSetDone ? 'bg-emerald-500 text-zinc-950' : 'bg-zinc-800 text-zinc-400'
                                                        }`}>
                                                            {index + 1}
                                                        </div>
                                                        <span className="text-xs font-semibold">
                                                            Série {index + 1}
                                                        </span>
                                                    </div>

                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xs font-mono bg-zinc-900 px-2.5 py-1 rounded-lg border border-zinc-800 text-zinc-400">
                                                            {repTarget} reps
                                                        </span>
                                                        <button 
                                                            className={`w-7 h-7 rounded-xl font-bold flex items-center justify-center text-xs transition-all ${
                                                                isSetDone 
                                                                    ? 'bg-emerald-500 text-zinc-950 shadow-md shadow-emerald-500/20' 
                                                                    : 'bg-zinc-800 text-zinc-500 hover:text-zinc-300'
                                                            }`}
                                                        >
                                                            {isSetDone ? '✓' : '+'}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
