<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino Semanal - Aquinoã</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-zinc-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialWorkouts = {
            "Segunda-feira (Treino A)": [
                { id: 1, name: "Extensora", sets: "4", reps: "12/10/6-8/RM", load: "20 / 25 / 27 / 30 kg", done: false },
                { id: 2, name: "Leg Press 45°", sets: "4", reps: "12/8-10/6-8/6-8", load: "170 / 180 / 186 / 188 kg", done: false },
                { id: 3, name: "Agachamento Livre", sets: "3", reps: "12 / 10 / 6-8", load: "22 / 50 / 58 kg", done: false },
                { id: 4, name: "Afundo no Smith", sets: "3", reps: "10 / 10 / 10", load: "10 kg", done: false }
            ],
            "Terça-feira (Treino B)": [
                { id: 1, name: "Puxada Aberta - Pronada", sets: "4", reps: "12/10/6-8/RM", load: "40 / 43 / 43 / 45 kg", done: false },
                { id: 2, name: "Remada Baixa - Triângulo", sets: "3", reps: "10-12", load: "40 / 42 / 42 kg", done: false },
                { id: 3, name: "Pulldown - Corda", sets: "3", reps: "8-10", load: "26 / 27 / 27 kg", done: false },
                { id: 4, name: "Remada Curvada - Supinada", sets: "3", reps: "10-12", load: "10 / 20 / 20 kg", done: false },
                { id: 5, name: "Desenvolvimento - Halter", sets: "4", reps: "8-10", load: "20 kg", done: false },
                { id: 6, name: "Elevação Lateral - Polia", sets: "3", reps: "10-12", load: "5 / 7 kg", done: false }
            ],
            "Quarta-feira (Treino C)": [
                { id: 1, name: "Stiff - Barra", sets: "4", reps: "15/12/10/6-8", load: "40 / 50 / 54 / 56 kg", done: false },
                { id: 2, name: "Cadeira Flexora", sets: "4", reps: "12/10/6-8/RM", load: "55 / 60 / 65 / 65 kg", done: false },
                { id: 3, name: "Flexora Unilateral", sets: "3", reps: "8-10", load: "10 / 12 / 13 kg", done: false },
                { id: 4, name: "Levantamento Terra Sumô", sets: "3", reps: "10-12", load: "40 / 43 / 45 kg", done: false },
                { id: 5, name: "Abdominal com Rolinho", sets: "4", reps: "10-12", load: "Peso corporal", done: false },
                { id: 6, name: "Flexão Plantar (Leg Press)", sets: "3", reps: "RM", load: "40 / 50 / 55 kg", done: false }
            ],
            "Quinta-feira (Treino D)": [
                { id: 1, name: "Crucifixo - Crossover", sets: "4", reps: "10-12", load: "20 / 24 / 26 kg", done: false },
                { id: 2, name: "Supino Inclinado - Halter", sets: "3", reps: "10-12", load: "24 / 28 kg", done: false },
                { id: 3, name: "Tríceps Pulley - Crossover", sets: "4", reps: "15/12/10/6", load: "15 / 17 / 18 / 20 kg", done: false },
                { id: 4, name: "Tríceps Francês - Polia", sets: "3", reps: "12/10/8", load: "25 / 27 kg", done: false },
                { id: 5, name: "Rosca Alternada - Inclinado", sets: "3", reps: "10-12", load: "10 / 14 kg", done: false },
                { id: 6, name: "Rosca Martelo - Crossover", sets: "3", reps: "12/10/8/6", load: "25 / 26 / 27 kg", done: false }
            ],
            "Sexta-feira (Treino E)": [
                { id: 1, name: "Cadeira Abdutora", sets: "4", reps: "RM", load: "90 / 94 kg", done: false },
                { id: 2, name: "Elevação Pélvica Articulada", sets: "3", reps: "12/10/8", load: "65 / 70 / 75 kg", done: false },
                { id: 3, name: "Agachamento Sumô - Halter", sets: "3", reps: "10-12", load: "50 / 60 / 64 kg", done: false },
                { id: 4, name: "Búlgaro no Smith", sets: "3", reps: "10/10/10", load: "26 kg", done: false },
                { id: 5, name: "Leg Press 45° Articulado", sets: "4", reps: "12/8/6/6", load: "170 / 180 / 188 kg", done: false }
            ]
        };

        function App() {
            const [workouts, setWorkouts] = useState(() => {
                const saved = localStorage.getItem('aquinoa_workouts_v4');
                return saved ? JSON.parse(saved) : initialWorkouts;
            });
            const [activeDay, setActiveDay] = useState("Segunda-feira (Treino A)");
            const [timer, setTimer] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                localStorage.setItem('aquinoa_workouts_v4', JSON.stringify(workouts));
            }, [workouts]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning) {
                    interval = setInterval(() => setTimer(t => t + 1), 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleSaveLoad = (day, id, newLoad) => {
                setWorkouts(prev => ({
                    ...prev,
                    [day]: prev[day].map(ex => ex.id === id ? { ...ex, load: newLoad } : ex)
                }));
                setEditingId(null);
            };

            const toggleDone = (day, id) => {
                setWorkouts(prev => ({
                    ...prev,
                    [day]: prev[day].map(ex => ex.id === id ? { ...ex, done: !ex.done } : ex)
                }));
            };

            const currentList = workouts[activeDay] || [];
            const completedCount = currentList.filter(ex => ex.done).length;
            const progressPercent = currentList.length > 0 ? Math.round((completedCount / currentList.length) * 100) : 0;

            return (
                <div className="max-w-md mx-auto p-4 pb-24">
                    {/* Header */}
                    <header className="mb-6 flex items-center justify-between pt-2">
                        <div>
                            <div className="flex items-center gap-1.5 text-emerald-400 font-semibold text-xs tracking-wider uppercase">
                                <span>🏋️‍♂️ Painel do Atleta</span>
                            </div>
                            <h1 className="text-2xl font-extrabold text-white mt-0.5 tracking-tight">Treino Semanal</h1>
                        </div>
                        <div className="w-10 h-10 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-sm">
                            AB
                        </div>
                    </header>

                    {/* Cronômetro */}
                    <div className="bg-gradient-to-b from-zinc-900 to-zinc-900/90 border border-zinc-800/80 rounded-3xl p-5 mb-6 shadow-xl relative overflow-hidden">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-zinc-400 text-xs font-semibold uppercase tracking-wider">⏱️ Descanso</span>
                            <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Série Ativa</span>
                        </div>
                        <div className="text-5xl font-mono font-black text-white text-center py-2 tracking-tight">
                            {formatTime(timer)}
                        </div>
                        <div className="flex justify-center gap-2 mt-3">
                            <button 
                                onClick={() => { setTimer(0); setIsTimerRunning(true); }} 
                                className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-2.5 rounded-2xl text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5 shadow-lg cursor-pointer"
                            >
                                ▶ Iniciar
                            </button>
                            <button 
                                onClick={() => setIsTimerRunning(false)} 
                                className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold py-2.5 rounded-2xl text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5 border border-zinc-700/50 cursor-pointer"
                            >
                                ⏸ Pausar
                            </button>
                            <button 
                                onClick={() => { setIsTimerRunning(false); setTimer(0); }} 
                                className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white px-3.5 py-2.5 rounded-2xl text-xs transition-all active:scale-95 flex items-center justify-center border border-zinc-700/50 cursor-pointer"
                            >
                                🔄
                            </button>
                        </div>
                    </div>

                    {/* Seletor de Dias */}
                    <div className="flex overflow-x-auto gap-2 mb-6 pb-2 no-scrollbar">
                        {Object.keys(workouts).map((day) => {
                            const isSelected = activeDay === day;
                            const label = day.split(" ")[0].replace("-feira", "");
                            const letter = day.match(/Treino ([A-E])/)?.[1] || "";
                            return (
                                <button
                                    key={day}
                                    onClick={() => setActiveDay(day)}
                                    className={`px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-2 cursor-pointer ${
                                        isSelected 
                                            ? 'bg-emerald-500 text-zinc-950 font-bold shadow-lg scale-105' 
                                            : 'bg-zinc-900/90 text-zinc-400 border border-zinc-800/80 hover:border-zinc-700'
                                    }`}
                                >
                                    <span>{label}</span>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold ${isSelected ? 'bg-zinc-950/20 text-zinc-950' : 'bg-zinc-800 text-zinc-300'}`}>
                                        {letter}
                                    </span>
                                </button>
                            );
                        })}
                    </div>

                    {/* Progresso do Treino */}
                    <div className="mb-4 bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-3.5 flex items-center justify-between gap-4">
                        <div className="flex-1">
                            <div className="flex justify-between items-center text-xs mb-1.5">
                                <span className="text-zinc-400 font-medium">Concluído hoje</span>
                                <span className="text-emerald-400 font-bold">{completedCount} de {currentList.length} ({progressPercent}%)</span>
                            </div>
                            <div className="w-full bg-zinc-800 rounded-full h-2 overflow-hidden">
                                <div 
                                    className="bg-emerald-500 h-full rounded-full transition-all duration-300 ease-out" 
                                    style={{ width: `${progressPercent}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>

                    {/* Lista de Exercícios */}
                    <div className="space-y-3">
                        <div className="flex justify-between items-center text-xs font-semibold text-zinc-400 uppercase tracking-wider px-1">
                            <span>{activeDay}</span>
                        </div>

                        {currentList.map((ex) => (
                            <div 
                                key={ex.id} 
                                className={`group bg-zinc-900/90 border rounded-2xl p-4 transition-all duration-200 ${
                                    ex.done 
                                        ? 'border-emerald-500/30 bg-emerald-500/[0.03] opacity-80' 
                                        : 'border-zinc-800/80 hover:border-zinc-700'
                                }`}
                            >
                                <div className="flex items-start justify-between gap-3">
                                    <button 
                                        onClick={() => toggleDone(activeDay, ex.id)}
                                        className={`mt-0.5 w-5 h-5 rounded-lg border flex items-center justify-center transition-all cursor-pointer ${
                                            ex.done 
                                                ? 'bg-emerald-500 border-emerald-500 text-zinc-950 font-bold' 
                                                : 'border-zinc-700 group-hover:border-emerald-500/50'
                                        }`}
                                    >
                                        {ex.done && "✓"}
                                    </button>
                                    <div className="flex-1">
                                        <h3 className={`font-semibold text-sm transition-all ${ex.done ? 'line-through text-zinc-500' : 'text-white'}`}>
                                            {ex.name}
                                        </h3>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="text-xs bg-zinc-800/80 text-zinc-300 px-2 py-0.5 rounded-md font-mono border border-zinc-700/40">
                                                {ex.sets} séries × {ex.reps}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mt-3 pt-3 border-t border-zinc-800/60">
                                    <div className="flex items-center gap-1.5 text-xs text-emerald-400 font-mono font-medium">
                                        <span>⚖️ Carga: {ex.load}</span>
                                    </div>
                                    <button 
                                        onClick={() => setEditingId(editingId === ex.id ? null : ex.id)}
                                        className="text-xs text-zinc-400 hover:text-emerald-400 transition-colors flex items-center gap-1 font-medium cursor-pointer"
                                    >
                                        ✏️ {editingId === ex.id ? 'Fechar' : 'Editar'}
                                    </button>
                                </div>

                                {editingId === ex.id && (
                                    <div className="mt-3 pt-3 border-t border-zinc-800/80 flex gap-2">
                                        <input 
                                            type="text" 
                                            defaultValue={ex.load}
                                            id={`input-${ex.id}`}
                                            className="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-1.5 text-xs text-white flex-1 font-mono focus:outline-none focus:border-emerald-500"
                                            placeholder="Ex: 20 / 25 / 30 kg"
                                        />
                                        <button 
                                            onClick={() => {
                                                const val = document.getElementById(`input-${ex.id}`).value;
                                                handleSaveLoad(activeDay, ex.id, val);
                                            }}
                                            className="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer"
                                        >
                                            Guardar
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
